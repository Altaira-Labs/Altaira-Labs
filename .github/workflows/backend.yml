name: Backend tests and JavaDoc

on:
  push:
    paths:
      - 'backend/**'
      - 'scripts/CheckJavaDocs.java'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/CheckJavaDocs.java'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check documented declarations
        run: java scripts/CheckJavaDocs.java
      - name: Run backend tests and build the references
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test javadoc:javadoc javadoc:test-javadoc
